<svg xmlns='http://www.w3.org/2000/svg' width='860' height='650' viewBox='0 0 860 650' role='img'><title>看懂界面与工作安排 — 资源与因果流程</title><desc>每行展示一条有方向的依赖；重复名称代表同一功能节点。</desc><defs><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8' fill='#176a6d'/></marker></defs><rect width='860' height='650' fill='#ffffff'/><g font-family='Microsoft YaHei, sans-serif' fill='#20323b'><text x='24' y='30' font-size='18'>看懂界面与工作安排 · 资源与因果</text><g><rect x='24' y='50' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='84' text-anchor='middle' font-size='18'>选择建筑</text></g><g><rect x='576' y='50' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='84' text-anchor='middle' font-size='18'>读取状态</text></g><line x1='298' y1='84' x2='558' y2='84' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='71' font-size='16' text-anchor='middle'>先看证据</text><g><rect x='24' y='140' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='174' text-anchor='middle' font-size='18'>读取状态</text></g><g><rect x='576' y='140' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='174' text-anchor='middle' font-size='18'>检查资源</text></g><line x1='298' y1='174' x2='558' y2='174' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='161' font-size='16' text-anchor='middle'>缺料时</text><g><rect x='24' y='230' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='264' text-anchor='middle' font-size='18'>读取状态</text></g><g><rect x='576' y='230' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='264' text-anchor='middle' font-size='18'>检查连接／通路</text></g><line x1='298' y1='264' x2='558' y2='264' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='251' font-size='16' text-anchor='middle'>连接问题时</text><g><rect x='24' y='320' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='354' text-anchor='middle' font-size='18'>检查资源</text></g><g><rect x='576' y='320' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='354' text-anchor='middle' font-size='18'>调整工作安排</text></g><line x1='298' y1='354' x2='558' y2='354' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='341' font-size='16' text-anchor='middle'>库存未送达</text><g><rect x='24' y='410' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='444' text-anchor='middle' font-size='18'>检查连接／通路</text></g><g><rect x='576' y='410' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='444' text-anchor='middle' font-size='18'>调整工作安排</text></g><line x1='298' y1='444' x2='558' y2='444' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='431' font-size='16' text-anchor='middle'>通路已修复</text><g><rect x='24' y='500' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='534' text-anchor='middle' font-size='18'>调整工作安排</text></g><g><rect x='576' y='500' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='534' text-anchor='middle' font-size='18'>再次观察</text></g><line x1='298' y1='534' x2='558' y2='534' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='521' font-size='16' text-anchor='middle'>验证变化</text><text x='24' y='630' font-size='15'>关系示意；不表示精确配比、施工尺寸或已经完成自动验收。</text></g></svg>