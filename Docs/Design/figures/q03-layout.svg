<svg xmlns='http://www.w3.org/2000/svg' width='860' height='330' viewBox='0 0 860 330' role='img'><title>启动前期氧气扩散器 — 概念布局</title><desc>功能分区示意，不是游戏截图或可照建蓝图。</desc><rect width='860' height='330' fill='#fff'/><g font-family='Microsoft YaHei, sans-serif' fill='#20323b'><text x='24' y='32' font-size='18'>启动前期氧气扩散器 · 功能分区</text><text x='24' y='62' font-size='15' fill='#805b21'>非实机截图 · 尺寸、管线和通路未经验证</text><g><rect x='24' y='88' width='250' height='70' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='149' y='129' text-anchor='middle' font-size='18'>发电与接线</text></g><g><rect x='304' y='88' width='250' height='70' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='429' y='129' text-anchor='middle' font-size='18'>扩散器</text></g><g><rect x='584' y='88' width='250' height='70' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='709' y='129' text-anchor='middle' font-size='18'>需供氧空间</text></g><g><rect x='24' y='183' width='250' height='70' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='149' y='224' text-anchor='middle' font-size='18'>藻类存放与运送</text></g><g><rect x='304' y='183' width='250' height='70' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='429' y='224' text-anchor='middle' font-size='18'>周围气体环境</text></g><g><rect x='584' y='183' width='250' height='70' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='709' y='224' text-anchor='middle' font-size='18'>观察氧气分布</text></g><text x='24' y='301' font-size='15'>先确认各区的作用，再依据游戏接口、方向与可达性安排实际位置。</text></g></svg>