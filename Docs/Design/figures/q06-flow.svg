<svg xmlns='http://www.w3.org/2000/svg' width='860' height='560' viewBox='0 0 860 560' role='img'><title>选址并启动第一种作物 — 资源与因果流程</title><desc>每行展示一条有方向的依赖；重复名称代表同一功能节点。</desc><defs><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8' fill='#176a6d'/></marker></defs><rect width='860' height='560' fill='#ffffff'/><g font-family='Microsoft YaHei, sans-serif' fill='#20323b'><text x='24' y='30' font-size='18'>选址并启动第一种作物 · 资源与因果</text><g><rect x='24' y='50' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='84' text-anchor='middle' font-size='18'>选定作物</text></g><g><rect x='576' y='50' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='84' text-anchor='middle' font-size='18'>合适容器</text></g><line x1='298' y1='84' x2='558' y2='84' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='71' font-size='16' text-anchor='middle'>选择容器</text><g><rect x='24' y='140' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='174' text-anchor='middle' font-size='18'>种子</text></g><g><rect x='576' y='140' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='174' text-anchor='middle' font-size='18'>合适容器</text></g><line x1='298' y1='174' x2='558' y2='174' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='161' font-size='16' text-anchor='middle'>播种</text><g><rect x='24' y='230' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='264' text-anchor='middle' font-size='18'>环境与供给</text></g><g><rect x='576' y='230' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='264' text-anchor='middle' font-size='18'>合适容器</text></g><line x1='298' y1='264' x2='558' y2='264' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='251' font-size='16' text-anchor='middle'>满足条件</text><g><rect x='24' y='320' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='354' text-anchor='middle' font-size='18'>合适容器</text></g><g><rect x='576' y='320' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='354' text-anchor='middle' font-size='18'>生长</text></g><line x1='298' y1='354' x2='558' y2='354' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='341' font-size='16' text-anchor='middle'>实际生长</text><g><rect x='24' y='410' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='154' y='444' text-anchor='middle' font-size='18'>生长</text></g><g><rect x='576' y='410' width='260' height='56' rx='7' fill='#e9f0eb' stroke='#8ca8a0'/><text x='706' y='444' text-anchor='middle' font-size='18'>收获物</text></g><line x1='298' y1='444' x2='558' y2='444' stroke='#176a6d' stroke-width='2' marker-end='url(#arrow)'/><text x='430' y='431' font-size='16' text-anchor='middle'>收获</text><text x='24' y='540' font-size='15'>关系示意；不表示精确配比、施工尺寸或已经完成自动验收。</text></g></svg>