 <section id="panel-prep" role="tabpanel" aria-labelledby="tab-prep"><h3>前置资源与条件</h3>${list(t.prerequisites)}<h3>玩家操作顺序</h3>${list(t.steps,true)}<h3>按钮在游戏中的作用</h3><table><thead><tr><th>入口</th><th>行为设计</th></tr></thead><tbody>${t.buttons.map(b=>`<tr><td>${esc(b[0])}</td><td>${esc(b[1])}</td></tr>`).join('')}</tbody></table></section>
 <section id="panel-example" role="tabpanel" aria-labelledby="tab-example" hidden><h3>资源与因果流程图</h3><figure><img class="diagram" src="figures/${t.id}-flow.svg" alt="${esc(t.title)}的资源与依赖关系"><figcaption>箭头表示输入、操作顺序或需要确认的关系；不等于任务解锁顺序。<a href="figures/${t.id}-flow.svg" download>保存流程图</a></figcaption></figure><h3>参考布局</h3><p class="scope">概念分区示意 · 非实机截图 · 未验证格子尺寸、管线接法和通路</p><figure><img class="diagram" src="figures/${t.id}-layout.svg" alt="${esc(t.title)}的功能分区示意"><figcaption>${esc(t.layoutNote)} <a href="figures/${t.id}-layout.svg" download>保存布局示意</a></figcaption></figure></section>
 <section id="panel-check" role="tabpanel" aria-labelledby="tab-check" hidden><h3>验收标准</h3>${list(t.acceptance)}<h3>遇到问题怎样反馈</h3>${list(t.feedback)}<h3>必须覆盖的测试</h3>${list(t.tests)}<h3>本任务边界</h3><p class="scope">${esc(t.scope)}</p><p>“已实现”只代表对应版本已有代码；具体实机覆盖以测试记录为准。未实现的检查不能在游戏中显示为已通过。</p></section>
 <footer><div class="actions"><a href="DESIGN.md">完整文字设计</a><a href="tasks.json">结构化任务设计</a><button type="button" id="print">打印当前任务</button></div><p>保留现有任务 ID、奖励及旧领奖记录；新判定分批实现。资源数量、科技 ID、环境阈值与复杂布局须从当前游戏版本核实。</p></footer>`;
  detail.querySelectorAll('[role="tab"]').forEach(button=>button.addEventListener('click',()=>activate(button)));
  detail.querySelector('.tabs').addEventListener('keydown',e=>{const tabs=[...detail.querySelectorAll('[role="tab"]')];let i=tabs.indexOf(document.activeElement);if(i<0)return;if(e.key==='ArrowRight')i=(i+1)%tabs.length;else if(e.key==='ArrowLeft')i=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();activate(tabs[i]);tabs[i].focus();});
  document.getElementById('print').addEventListener('click',()=>window.print());menu();
 }
 function activate(button){detail.querySelectorAll('[role="tab"]').forEach(b=>{const active=b===button;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;document.getElementById(b.getAttribute('aria-controls')).hidden=!active;});}
 nav.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;selected=tasks.find(t=>t.id===b.dataset.id);location.hash=selected.id;render();});
 search.addEventListener('input',menu);window.addEventListener('hashchange',()=>{const t=tasks.find(t=>t.id===location.hash.slice(1));if(t&&t!==selected){selected=t;render();}});render();
})();
</script></body></html>
